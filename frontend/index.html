<head>

  <meta name="description"
    content="D'CosMedis Clinic – Best Skin Clinic in Delhi. Advanced Dermatology & Aesthetic Treatments for Skin, Hair & Anti-Aging." />
  <meta name="keywords" content="dermatology, skin clinic, aesthetic treatments, anti-aging, D'CosMedis, Delhi" />
  <!-- Preconnect to image CDNs for faster image loads -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Preload first hero image dynamically based on viewport to perfect LCP -->
  <link
    rel="preload"
    as="image"
    imagesrcset="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=400&q=60&fm=webp 400w, https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=800&q=60&fm=webp 800w"
    media="(max-width: 640px)"
    fetchpriority="high"
  />
  <link
    rel="preload"
    as="image"
    imagesrcset="https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=1280&q=60&fm=webp 1280w, https://images.unsplash.com/photo-1570172619644-dfd03ed5d881?w=1600&q=60&fm=webp 1600w"
    media="(min-width: 641px)"
    fetchpriority="high"
  />

  <!-- Google Fonts: async with font-display=swap to prevent CLS -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap&font-display=swap"

  />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600;700&display=swap&font-display=swap"
    />
